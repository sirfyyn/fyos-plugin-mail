<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Skizze: FYOS Post</title>
<desc id="d">Links eine Mitteilung des Agenten, rechts der eigene Listmonk mit einer Kampagne im Entwurf. Darunter der Hinweis, dass der Start einer Kampagne bei dir liegt.</desc>
<style>
.bg{fill:#f4f1ea}.fl{fill:#fffdf8}.bar{fill:#e6e0d3}.ink{fill:#2b2a27}.mut{fill:#8b8578}.acc{fill:#3f7d6e}.wrm{fill:#c9824a}
.ln{fill:none;stroke:#2b2a27;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dsh{stroke-dasharray:6 5;opacity:.45}
text{font-family:ui-rounded,system-ui,-apple-system,sans-serif;font-size:14px}
@media (prefers-color-scheme:dark){.bg{fill:#1d1c1a}.fl{fill:#2a2926}.bar{fill:#3a3833}.ink{fill:#ece7dc}.mut{fill:#8f897c}.acc{fill:#5fb3a0}.wrm{fill:#e0a06b}.ln{stroke:#ece7dc}}
</style>
<rect class="bg" width="640" height="400" rx="14"/>
<rect class="ln dsh" x="6" y="6" width="628" height="388" rx="10"/>
<rect class="fl" x="30" y="26" width="270" height="260" rx="12"/>
<rect class="ln" x="30" y="26" width="270" height="260" rx="12"/>
<rect class="bar" x="31" y="27" width="268" height="28" rx="11"/>
<text class="ink" x="46" y="46">Mitteilung</text>
<text class="ink" x="46" y="86" font-weight="700">Aufgabe fertig</text>
<text class="mut" x="46" y="112">Der Bericht liegt bereit.</text>
<text class="mut" x="46" y="134">Zwei Punkte brauchen deinen Blick.</text>
<path class="ln" d="M46 252h238" opacity=".3"/>
<text class="mut" x="46" y="272" font-size="12">Von Agent über FYOS Post</text>
<rect class="fl" x="340" y="26" width="270" height="260" rx="12"/>
<rect class="ln" x="340" y="26" width="270" height="260" rx="12"/>
<rect class="bar" x="341" y="27" width="268" height="28" rx="11"/>
<text class="ink" x="356" y="46">Listmonk</text>
<rect class="bar" x="356" y="74" width="238" height="52" rx="8"/><circle class="wrm" cx="376" cy="100" r="6"/>
<text class="ink" x="392" y="96" font-weight="700">Oktober-Brief</text>
<text class="mut" x="392" y="116">Entwurf, 1 Liste</text>
<rect class="bar" x="356" y="134" width="238" height="52" rx="8" opacity=".6"/><circle class="acc" cx="376" cy="160" r="6"/>
<text class="ink" x="392" y="156">Testmail</text>
<text class="mut" x="392" y="176">angenommen</text>
<path class="ln" d="M300 156h40" opacity=".5"/>
<path class="ln" d="M330 148l10 8-10 8" opacity=".5"/>
<path class="ln" d="M60 320h520" opacity=".3"/>
<text class="ink" x="60" y="346" font-weight="700">Gestartet wird von dir</text>
<text class="mut" x="238" y="346">Der Agent legt nur Entwürfe an und schickt Testmails.</text>
<text class="mut" x="566" y="388" font-size="12">Skizze</text>
</svg>
